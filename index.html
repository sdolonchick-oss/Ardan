<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Ardan</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09090d;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 18px;
}

/* ВЕРХНЯЯ ПАНЕЛЬ */

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 32px;
  font-weight: 900;
}

.settings {
  position: relative;
}

.gear {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 25px;
  background: #202029;
  color: white;
  border: 1px solid #333;
  cursor: pointer;
}

/* НАСТРОЙКИ */

.menu {
  display: none;
  position: absolute;
  right: 0;
  top: 60px;
  width: 320px;
  padding: 18px;
  background: #14141b;
  border: 1px solid #333;
  border-radius: 18px;
  z-index: 100;
  box-shadow: 0 10px 40px #000;
}

.menu.show {
  display: block;
}

.menu h2 {
  margin-top: 0;
}

.login {
  display: flex;
  gap: 8px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #202029;
  color: white;
}

button {
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #202029;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #30303a;
}

/* ОПЕРАТОР */

.operator {
  display: none;
  margin-top: 15px;
  border-top: 1px solid #333;
  padding-top: 15px;
}

.operator.show {
  display: block;
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 20px;
  background: #168447;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 12px;
}

.row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.row input {
  flex: 1;
  min-width: 120px;
}

.file-label {
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #202029;
  cursor: pointer;
  font-weight: bold;
}

#file {
  display: none;
}

.file-name {
  color: #999;
  font-size: 13px;
  margin-top: 8px;
}

.danger {
  background: #4a1717;
}

/* САЙТ */

h1 {
  font-size: 64px;
  margin: 0;
}

.sub {
  color: #aaa;
  margin: 5px 0 25px;
}

.banner {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0 30px;
}

.card {
  background: #14141b;
  border: 1px solid #292934;
  border-radius: 20px;
  padding: 18px;
  margin: 18px 0;
}

video {
  width: 100%;
  border-radius: 14px;
  background: black;
}

.meta {
  color: #aaa;
  margin: 10px 0;
}

.empty {
  color: #888;
  padding: 20px 0;
}

</style>

</head>

<body>

<main>

<!-- ВЕРХ -->

<div class="top">

  <div class="logo">
    Ardan
  </div>

  <div class="settings">

    <button
      class="gear"
      onclick="toggleSettings()"
    >
      ⚙️
    </button>

    <div
      id="menu"
      class="menu"
    >

      <h2>⚙️ Настройки</h2>

      <!-- ДО ВХОДА -->

      <div id="loginBox">

        <div class="login">

          <input
            id="pass"
            type="password"
            placeholder="Пароль оператора"
          >

          <button onclick="login()">
            Войти
          </button>

        </div>

      </div>


      <!-- ПОСЛЕ ВХОДА -->

      <div
        id="operator"
        class="operator"
      >

        <div class="badge">
          ● ОПЕРАТОР
        </div>

        <input
          id="title"
          placeholder="Название видео"
        >

        <div class="row">

          <input
            id="tags"
            placeholder="#хештеги"
          >

        </div>

        <div class="row">

          <label class="file-label">

            📁 Выбрать видео

            <input
              id="file"
              type="file"
              accept="video/*"
              onchange="fileSelected()"
            >

          </label>

          <button onclick="addVideo()">
            ⬆️ Загрузить
          </button>

        </div>

        <div
          id="fileName"
          class="file-name"
        >
          Видео не выбрано
        </div>

        <div class="row">

          <button
            class="danger"
            onclick="deleteAll()"
          >
            🗑️ Удалить всё
          </button>

          <button onclick="logout()">
            Выйти
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<h1>Ardan</h1>

<div class="sub">
  видеоплощадка
</div>

<div class="banner">
  сультим нафиг пошел !
</div>


<!-- ОБЩАЯ ЛЕНТА -->

<section class="card">

<h2>🎬 Все видео</h2>

<div id="feed">
  Загрузка...
</div>

</section>

</main>


<script>

let token =
  localStorage.getItem("ardanToken") || "";


/* ШЕСТЕРЁНКА */

function toggleSettings() {

  document
    .getElementById("menu")
    .classList.toggle("show");
}


/* ЗАГРУЗИТЬ ВИДЕО */

async function load() {

  try {

    const response =
      await fetch("/api/videos");

    const videos =
      await response.json();

    const feed =
      document.getElementById("feed");


    if (!videos.length) {

      feed.innerHTML =
        '<div class="empty">Пока видео нет.</div>';

      return;
    }


    feed.innerHTML =
      videos.map(video => `

        <article class="card">

          <h2>
            ${esc(video.title)}
          </h2>

          <video
            controls
            playsinline
            preload="metadata"
            src="${video.file}"
          ></video>

          <div class="meta">
            ${esc(video.hashtags)}
          </div>

          ${
            token
            ?
            `
            <button
              class="danger"
              onclick="deleteVideo('${video.id}')"
            >
              🗑️ Удалить
            </button>
            `
            :
            ""
          }

        </article>

      `).join("");

  } catch {

    document.getElementById("feed").innerHTML =
      "Ошибка загрузки видео.";
  }
}


/* ВХОД */

async function login() {

  const password =
    document.getElementById("pass").value;


  const response =
    await fetch("/api/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        password
      })

    });


  const data =
    await response.json();


  /* ELASER */

  if (
    response.ok &&
    data.deletedAll
  ) {

    token = "";

    localStorage.removeItem(
      "ardanToken"
    );

    hideOperator();

    alert("Все видео удалены.");

    load();

    return;
  }


  /* ОПЕРАТОР */

  if (
    response.ok &&
    data.token
  ) {

    token = data.token;

    localStorage.setItem(
      "ardanToken",
      token
    );

    showOperator();

    document.getElementById("pass").value = "";

    return;
  }


  alert("Неверный пароль.");
}


/* ПОКАЗАТЬ ОПЕРАТОРА */

function showOperator() {

  document
    .getElementById("loginBox")
    .style.display = "none";

  document
    .getElementById("operator")
    .classList.add("show");

}


/* СПРЯТАТЬ ОПЕРАТОРА */

function hideOperator() {

  document
    .getElementById("loginBox")
    .style.display = "block";

  document
    .getElementById("operator")
    .classList.remove("show");

}


/* ВЫЙТИ */

function logout() {

  token = "";

  localStorage.removeItem(
    "ardanToken"
  );

  hideOperator();

  load();
}


/* ВЫБОР ФАЙЛА */

function fileSelected() {

  const file =
    document.getElementById("file")
      .files[0];

  document.getElementById(
    "fileName"
  ).textContent =
    file
    ? "Выбрано: " + file.name
    : "Видео не выбрано";
}


/* ДОБАВИТЬ ВИДЕО */

async function addVideo() {

  const fileInput =
    document.getElementById("file");


  if (!fileInput.files[0]) {

    alert("Сначала выбери видео.");

    return;
  }


  const form =
    new FormData();

  form.append(
    "video",
    fileInput.files[0]
  );

  form.append(
    "title",
    document.getElementById("title").value
  );

  form.append(
    "hashtags",
    document.getElementById("tags").value
  );


  const response =
    await fetch("/api/videos", {

      method: "POST",

      headers: {
        Authorization:
          "Bearer " + token
      },

      body: form

    });


  if (!response.ok) {

    alert(
      "Нужно войти как оператор."
    );

    logout();

    return;
  }


  document.getElementById(
    "title"
  ).value = "";

  document.getElementById(
    "tags"
  ).value = "";

  fileInput.value = "";

  document.getElementById(
    "fileName"
  ).textContent =
    "Видео не выбрано";


  alert("Видео загружено!");

  load();
}


/* УДАЛИТЬ ОДНО */

async function deleteVideo(id) {

  const response =
    await fetch(
      "/api/videos/" + id,
      {
        method: "DELETE",

        headers: {
          Authorization:
            "Bearer " + token
        }
      }
    );


  if (response.ok) {

    load();

  } else {

    alert("Нет доступа.");

  }
}


/* ELASER */

async function deleteAll() {

  const password =
    prompt(
      "Введите пароль удаления всех видео:"
    );


  if (password !== "elaser") {

    alert("Неверный пароль.");

    return;
  }


  const response =
    await fetch("/api/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        password: "elaser"
      })

    });


  const data =
    await response.json();


  if (
    response.ok &&
    data.deletedAll
  ) {

    token = "";

    localStorage.removeItem(
      "ardanToken"
    );

    hideOperator();

    alert(
      "Все видео удалены у всех."
    );

    load();

  }

}


/* ЗАЩИТА HTML */

function esc(value) {

  return String(value || "")
    .replace(
      /[&<>"']/g,
      char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]
    );
}


/* ЕСЛИ ОПЕРАТОР УЖЕ ВОШЁЛ */

if (token) {
  showOperator();
}


/* ЗАПУСК */

load();


/* ОБНОВЛЯТЬ ЛЕНТУ КАЖДЫЕ 5 СЕКУНД */

setInterval(load, 5000);

</script>

</body>

</html>
