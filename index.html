<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ardan</title>

<style>
body{
  margin:0;
  background:#09090d;
  color:#fff;
  font-family:Arial,sans-serif
}

main{
  max-width:900px;
  margin:auto;
  padding:35px 16px
}

h1{
  font-size:64px;
  margin:0
}

.sub{
  color:#aaa;
  margin:4px 0 30px
}

.banner{
  font-size:28px;
  font-weight:800;
  margin:20px 0 30px
}

.card{
  background:#14141b;
  border:1px solid #292934;
  border-radius:20px;
  padding:18px;
  margin:18px 0
}

video{
  width:100%;
  border-radius:14px;
  background:#000
}

button,input{
  padding:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#202029;
  color:white
}

button{
  cursor:pointer;
  font-weight:700
}

.operator{
  display:none
}

.operator.show{
  display:block
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px
}

.row input{
  flex:1;
  min-width:180px
}

.meta{
  color:#aaa;
  margin:10px 0
}

.danger{
  background:#4a1717
}

.login{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

small{
  color:#777
}

.empty{
  color:#888;
  padding:20px 0
}
</style>
</head>

<body>

<main>

<h1>Ardan</h1>
<div class="sub">видеоплощадка</div>

<div class="banner">
  сультим нафиг пошел !
</div>

<section class="card">

<h2>Видео</h2>

<div id="feed">
  Загрузка...
</div>

</section>

<section class="card">

<h2>Я оператор</h2>

<div class="login">

<input
  id="pass"
  type="password"
  placeholder="Пароль оператора"
>

<button onclick="login()">
  Войти
</button>

</div>

<div id="op" class="operator">

<div class="row">

<input
  id="title"
  placeholder="Название"
>

<input
  id="tags"
  placeholder="#хештеги"
>

</div>

<div class="row">

<input
  id="file"
  type="file"
  accept="video/*"
>

<button onclick="addVideo()">
  Добавить еще видео
</button>

</div>

<br>

<button
  class="danger"
  onclick="deleteAllFromOperator()"
>
  Удалить все видео
</button>

<br><br>

<small>
Только оператор может добавлять и удалять видео.
</small>

</div>

</section>

</main>

<script>

let token = localStorage.ardanToken || "";

async function load(){

  try{

    const r = await fetch("/api/videos");
    const a = await r.json();

    const feed = document.getElementById("feed");

    if(!a.length){

      feed.innerHTML =
        '<div class="empty">Пока видео нет.</div>';

      return;
    }

    feed.innerHTML = a.map(v => `

      <article class="card">

        <h2>${esc(v.title)}</h2>

        <video
          controls
          playsinline
          src="${v.file}"
        ></video>

        <div class="meta">
          ${esc(v.hashtags)}
        </div>

        ${
          token
          ?
          `<button
            class="danger"
            onclick="del('${v.id}')"
          >
            Удалить
          </button>`
          :
          ""
        }

      </article>

    `).join("");

  }catch(e){

    document.getElementById("feed").innerHTML =
      "Ошибка загрузки видео.";

  }

}


// ВХОД
async function login(){

  const password =
    document.getElementById("pass").value;

  const r = await fetch("/api/login",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      password:password
    })

  });

  const data = await r.json();

  // elaser
  if(r.ok && data.deletedAll){

    token = "";

    localStorage.removeItem("ardanToken");

    document
      .getElementById("op")
      .classList.remove("show");

    document.getElementById("pass").value = "";

    alert("Все видео удалены.");

    load();

    return;
  }

  // обычный оператор
  if(r.ok && data.token){

    token = data.token;

    localStorage.ardanToken = token;

    document
      .getElementById("op")
      .classList.add("show");

    document.getElementById("pass").value = "";

    load();

    return;
  }

  alert("Неверный пароль.");
}


// ДОБАВИТЬ ВИДЕО
async function addVideo(){

  const fileInput =
    document.getElementById("file");

  if(!fileInput.files[0]){

    alert("Выбери видео.");

    return;
  }

  const form =
    new FormData();

  form.append(
    "video",
    fileInput.files[0]
  );

  form.append(
    "title",
    document.getElementById("title").value
  );

  form.append(
    "hashtags",
    document.getElementById("tags").value
  );

  const r = await fetch(
    "/api/videos",
    {
      method:"POST",

      headers:{
        Authorization:"Bearer " + token
      },

      body:form
    }
  );

  if(!r.ok){

    alert("Нужен вход оператора.");

    return;
  }

  document.getElementById("title").value = "";
  document.getElementById("tags").value = "";
  fileInput.value = "";

  load();
}


// УДАЛИТЬ ОДНО
async function del(id){

  const r = await fetch(
    "/api/videos/" + id,
    {
      method:"DELETE",

      headers:{
        Authorization:"Bearer " + token
      }
    }
  );

  if(r.ok){

    load();

  }else{

    alert("Нет доступа.");

  }
}


// УДАЛИТЬ ВСЁ
async function deleteAllFromOperator(){

  const password =
    prompt(
      "Введите специальный пароль для удаления всех видео:"
    );

  if(password !== "elaser"){

    if(password !== null){
      alert("Неверный пароль.");
    }

    return;
  }

  const r = await fetch("/api/login",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      password:"elaser"
    })

  });

  const data = await r.json();

  if(r.ok && data.deletedAll){

    token = "";

    localStorage.removeItem("ardanToken");

    document
      .getElementById("op")
      .classList.remove("show");

    alert("Все видео удалены у всех.");

    load();

  }else{

    alert("Ошибка.");

  }
}


// Защита текста
function esc(s){

  return String(s || "")
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c])
    );

}


// Если оператор уже входил
if(token){

  document
    .getElementById("op")
    .classList.add("show");

}

// Загружаем общие видео
load();


// Обновлять список каждые 5 секунд,
// чтобы новые видео появлялись у других посетителей
setInterval(load,5000);

</script>

</body>
</html>
