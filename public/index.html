<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ardan</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#09090d;
  color:#fff;
  font-family:Arial,sans-serif
}
main{
  max-width:900px;
  margin:auto;
  padding:25px 16px
}
h1{
  font-size:64px;
  margin:0
}
.sub{
  color:#aaa;
  margin:4px 0 30px
}
.banner{
  font-size:28px;
  font-weight:800;
  margin:20px 0 30px
}
.card{
  background:#14141b;
  border:1px solid #292934;
  border-radius:20px;
  padding:18px;
  margin:18px 0
}
video{
  width:100%;
  border-radius:14px;
  background:#000;
  display:block
}
button,input{
  padding:13px;
  border-radius:10px;
  border:1px solid #444;
  background:#202029;
  color:white;
  font-size:16px
}
button{
  cursor:pointer;
  font-weight:700
}
button:active{
  transform:scale(.98)
}
.operator{
  display:none
}
.operator.show{
  display:block
}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px
}
.row input{
  flex:1;
  min-width:180px
}
.meta{
  color:#aaa;
  margin:10px 0
}
.danger{
  background:#4a1717
}
.login{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.status{
  margin-top:12px;
  color:#aaa
}
</style>
</head>

<body>
<main>

<h1>Ardan</h1>
<div class="sub">видеоплощадка</div>

<div class="banner">сультим нафиг пошел !</div>

<section class="card">
<h2>Видео</h2>
<div id="feed">Загрузка...</div>
</section>

<section class="card">

<h2>Я оператор</h2>

<div class="login">
<input
  id="pass"
  type="password"
  placeholder="Пароль оператора"
>
<button type="button" onclick="login()">
Войти
</button>
</div>

<div id="op" class="operator">

<div class="row">
<input
  id="title"
  type="text"
  placeholder="Название видео"
>

<input
  id="tags"
  type="text"
  placeholder="#хештеги"
>
</div>

<div class="row">

<input
  id="file"
  type="file"
  accept="video/*,.mp4,.mov,.webm,.m4v"
>

<button
  type="button"
  onclick="addVideo()"
>
Загрузить видео
</button>

</div>

<div id="status" class="status"></div>

<small>
Только оператор может добавлять, называть и задавать хештеги.
</small>

</div>

</section>

</main>

<script>

let token = localStorage.getItem("ardanToken") || "";

const feed = document.getElementById("feed");
const pass = document.getElementById("pass");
const op = document.getElementById("op");
const file = document.getElementById("file");
const title = document.getElementById("title");
const tags = document.getElementById("tags");
const statusBox = document.getElementById("status");


// Загрузка списка видео
async function load(){

  try{

    const r = await fetch("/api/videos");

    if(!r.ok){
      throw new Error("Ошибка сервера");
    }

    const videos = await r.json();

    if(!videos.length){
      feed.innerHTML = "Пока видео нет.";
      return;
    }

    feed.innerHTML = videos.map(v => `

      <article class="card">

        <h2>${esc(v.title)}</h2>

        <video
          controls
          playsinline
          preload="metadata"
          src="${esc(v.file)}"
        ></video>

        <div class="meta">
          ${esc(v.hashtags)}
        </div>

        ${
          token
          ?
          `<button
             type="button"
             class="danger"
             onclick="del('${v.id}')">
             Удалить
           </button>`
          :
          ""
        }

      </article>

    `).join("");

  }catch(e){

    feed.innerHTML =
      "Не удалось загрузить список видео.";

  }

}


// Вход оператора
async function login(){

  const password = pass.value.trim();

  if(!password){
    alert("Введи пароль оператора");
    return;
  }

  try{

    const r = await fetch("/api/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        password:password
      })

    });

    const data = await r.json();

    if(!r.ok){

      token = "";
      localStorage.removeItem("ardanToken");

      op.classList.remove("show");

      alert(data.error || "Неверный пароль");

      return;
    }

    token = data.token;

    localStorage.setItem(
      "ardanToken",
      token
    );

    op.classList.add("show");

    statusBox.textContent =
      "Вы вошли как оператор.";

    load();

  }catch(e){

    alert("Ошибка соединения с сервером");

  }

}


// Загрузка видео
async function addVideo(){

  const selected = file.files[0];

  if(!selected){

    alert("Сначала выбери видео");

    return;
  }

  if(!token){

    alert("Сначала войди как оператор");

    return;
  }

  statusBox.textContent =
    "Загрузка видео...";

  const form = new FormData();

  form.append(
    "video",
    selected
  );

  form.append(
    "title",
    title.value.trim() || "Без названия"
  );

  form.append(
    "hashtags",
    tags.value.trim()
  );

  try{

    const r = await fetch(
      "/api/videos",
      {
        method:"POST",

        headers:{
          Authorization:
            "Bearer " + token
        },

        body:form
      }
    );

    let data = {};

    try{
      data = await r.json();
    }catch(e){}

    if(r.status === 401){

      token = "";

      localStorage.removeItem(
        "ardanToken"
      );

      op.classList.remove("show");

      statusBox.textContent = "";

      alert(
        "Сессия закончилась. Войди оператором снова."
      );

      return;
    }

    if(!r.ok){

      statusBox.textContent = "";

      alert(
        data.error ||
        "Не удалось загрузить видео"
      );

      return;
    }

    statusBox.textContent =
      "Видео успешно загружено!";

    title.value = "";
    tags.value = "";
    file.value = "";

    await load();

  }catch(e){

    statusBox.textContent = "";

    alert(
      "Ошибка соединения с сервером"
    );

  }

}


// Удаление видео
async function del(id){

  if(!token){

    alert("Сначала войди оператором");

    return;
  }

  try{

    const r = await fetch(
      "/api/videos/" + id,
      {
        method:"DELETE",

        headers:{
          Authorization:
            "Bearer " + token
        }
      }
    );

    if(r.status === 401){

      token = "";

      localStorage.removeItem(
        "ardanToken"
      );

      op.classList.remove("show");

      alert("Войди оператором снова");

      return;
    }

    await load();

  }catch(e){

    alert("Ошибка удаления");

  }

}


// Защита текста
function esc(s){

  return String(s || "")
    .replace(/[&<>"']/g, function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];

    });

}


// Показываем операторскую панель
if(token){

  op.classList.add("show");

}

load();

</script>

</body>
</html>
